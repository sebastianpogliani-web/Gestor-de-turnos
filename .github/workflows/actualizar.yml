name: Actualizar visitas

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas (UTC); Argentina = UTC-3
  workflow_dispatch:          # permite correr manualmente desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            tzdata

      - name: Escribir credenciales desde Secrets
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" | tr -d '[:space:]' | base64 -d > credentials.json
          echo "${{ secrets.GOOGLE_TOKEN }}"       | tr -d '[:space:]' | base64 -d > token.json

      - name: Configurar git y sincronizar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Correr actualizar.py
        run: python actualizar.py
        env:
          CI: "true"

      - name: Commit y push de index.html
        run: |
          git add index.html
          git diff --staged --quiet && echo "Sin cambios." || (
            git commit -m "Actualización automática - $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )
