<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Visitas · Equipo Ciencia</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--red:#E61D2B;--dark:#1a1a1a;--gray:#5C5D5B;--bg:#f0f0f0;--card:#ffffff;--border:#e0e0e0}
        body{font-family:Calibri,'Segoe UI',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
        .top-bar{background:#fff;padding:.85rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;border-bottom:3px solid var(--red);box-shadow:0 2px 8px rgba(0,0,0,.07)}
        .logo-img{height:54px;width:auto}
        .top-meta{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
        .meta-pill{background:#f5f5f5;border:1px solid var(--border);color:var(--gray);font-size:.68rem;padding:.26rem .65rem;border-radius:20px}
        .meta-pill.ts{background:rgba(230,29,43,.05);border-color:rgba(230,29,43,.3);color:var(--red);font-weight:600}
        .page{padding:1.2rem 1.5rem;max-width:1400px;margin:0 auto}
        .page-title{font-size:1.3rem;font-weight:700;color:var(--dark);margin-bottom:.2rem}
        .page-sub{font-size:.78rem;color:var(--gray);margin-bottom:1.2rem}
        .resumen{background:var(--card);border-radius:12px;padding:1.1rem;border:1px solid var(--border);margin-bottom:1.1rem;box-shadow:0 2px 6px rgba(0,0,0,.05)}
        .sec-title{font-size:.66rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.85rem;display:flex;align-items:center;gap:.4rem}
        .sec-title::before{content:'';width:3px;height:12px;background:var(--red);border-radius:2px;flex-shrink:0}
        .resumen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:.65rem;margin-bottom:.85rem}
        .rc{background:#fafafa;padding:.75rem;border-radius:8px;border:1px solid var(--border)}
        .rc.ok{background:#f0fdf4;border-color:#bbf7d0}
        .rc.alerta{background:#fff5f5;border-color:#fecaca}
        .rc-icon{font-size:1.15rem;margin-bottom:.22rem}
        .rc-lbl{font-size:.55rem;color:var(--gray);text-transform:uppercase;letter-spacing:.06em}
        .rc-val{font-size:1.3rem;font-weight:700;color:var(--dark)}
        .rc.ok .rc-val{color:#16a34a}.rc.alerta .rc-val{color:var(--red)}
        .rc-sub{font-size:.56rem;color:var(--gray);margin-top:.08rem}
        .alertas-box{background:#fff5f5;border:1px solid #fecaca;border-radius:8px;padding:.75rem}
        .alertas-title{font-size:.72rem;font-weight:700;color:var(--red);margin-bottom:.4rem}
        .alerta-row{display:flex;justify-content:space-between;align-items:center;background:white;padding:.42rem .58rem;border-radius:6px;margin-bottom:.26rem;font-size:.71rem;border:1px solid #fecaca}
        .alerta-badge{color:var(--red);font-weight:700}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
        .day-card{background:var(--card);border-radius:12px;padding:1.05rem;border:2px solid #22c55e;box-shadow:0 2px 6px rgba(0,0,0,.05);animation:fadeUp .38s ease backwards}
        .day-card.prob{border-color:var(--red)}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .day-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding-bottom:.65rem;border-bottom:1px solid var(--border)}
        .day-name{font-size:.58rem;color:var(--gray);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
        .day-date{font-size:1.02rem;font-weight:700;color:var(--dark)}
        .day-meta{font-size:.57rem;color:var(--gray);margin-top:.08rem}
        .sicon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;border:2px solid;flex-shrink:0}
        .sicon.ok{background:#f0fdf4;border-color:#22c55e}
        .sicon.alerta{background:#fff5f5;border-color:var(--red)}
        .turno{background:#fafafa;padding:.55rem;border-radius:7px;margin-bottom:.36rem;border:1px solid var(--border)}
        .turno.prob{background:#fff5f5;border-color:#fecaca}
        .turno-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.26rem}
        .turno-lbl{font-size:.58rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.04em}
        .dbadge{background:var(--red);color:white;padding:.08rem .36rem;border-radius:20px;font-size:.56rem;font-weight:700}
        .turno-stats{display:flex;align-items:center;gap:.36rem}
        .tg{flex:1}.tl{font-size:.52rem;color:var(--gray)}.tv{font-size:1.1rem;font-weight:700;color:var(--dark)}
        .tv.ok{color:#16a34a}.tv.bad{color:var(--red)}
        .tsep{font-size:.9rem;color:#ccc}
        .medicos{font-size:.55rem;color:var(--gray);margin-top:.16rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .vlist{margin-top:.68rem;padding-top:.68rem;border-top:1px solid var(--border)}
        .vlbl{font-size:.56rem;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.26rem;font-weight:700}
        .vi{font-size:.66rem;padding:.3rem .4rem;background:#fafafa;border-radius:5px;margin-bottom:.18rem;border:1px solid var(--border)}
        .vi-name{font-weight:600;color:var(--dark);margin-bottom:.07rem}
        .vi-time{font-size:.54rem;color:var(--gray)}
        @media(max-width:600px){.page{padding:.85rem}.grid{grid-template-columns:1fr}.logo-img{height:38px}}
    </style>
</head>

function fechaARG(dt){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(dt))}
function procesarDias(){
  const hoy=new Date(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date())+'T00:00:00-03:00');
  return Array.from({length:7},(_,i)=>{
    const d=new Date(hoy); d.setDate(hoy.getDate()+i);
    const fs=fechaARG(d); const ds=d.getDay();
    function getDisp(){
      if(ds===6){
        const key='sabado_'+d.getDate()+'/'+(d.getMonth()+1);
        if(DISP[key]) return DISP[key];
      }
      return DISP[ds]||{M:0,D:0,T:0};
    }
    function getMed(){
      if(ds===6){
        const key='sabado_'+d.getDate()+'/'+(d.getMonth()+1);
        if(MEDICOS[key]) return MEDICOS[key];
      }
      return MEDICOS[ds]||{M:'',D:'',T:''};
    }
    const visitas=EVENTOS.filter(ev=>fechaARG(ev.ini)===fs);
    const cnt={M:0,D:0,T:0};
    visitas.forEach(ev=>{const h=parseInt(new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',hour12:false}).format(new Date(ev.ini)));cnt[turno(h)]++;});
    const dp=getDisp();
    const med=getMed();
    const probs=['M','D','T'].filter(t=>cnt[t]>dp[t]).map(t=>{return{t,v:cnt[t],d:dp[t],def:cnt[t]-dp[t]}});
    return{d,nombre:DIAS[ds],hayProb:probs.length>0,cnt,dp,med,visitas,probs};
  });
}
function render(){
  const ahora=new Date();
  const p=new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(ahora);
  const g=t=>p.find(x=>x.type===t)?.value||'';
  document.getElementById('pill-ts').textContent='✓ '+g('day')+' '+g('month')+' · '+g('hour')+':'+g('minute')+' hs';
  const dias=procesarDias();
  const conProb=dias.filter(d=>d.hayProb).length;
  const ok=dias.length-conProb;
  const totalV=dias.reduce((s,d)=>s+d.cnt.M+d.cnt.D+d.cnt.T,0);
  const totalDef=dias.reduce((s,d)=>s+d.probs.reduce((ps,p)=>ps+p.def,0),0);
  const tc={M:0,D:0,T:0};
  dias.forEach(d=>d.probs.forEach(p=>tc[p.t]++));
  const [tm]=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  document.getElementById('resumen').innerHTML=`
  <div class="resumen">
    <div class="sec-title">Resumen — próximos 7 días</div>
    <div class="resumen-grid">
      <div class="rc ${conProb===0?'ok':'alerta'}"><div class="rc-icon">${conProb===0?'✅':'⚠️'}</div><div class="rc-lbl">Estado</div><div class="rc-val">${ok}/${dias.length}</div><div class="rc-sub">días OK</div></div>
      <div class="rc"><div class="rc-icon">📅</div><div class="rc-lbl">Visitas</div><div class="rc-val">${totalV}</div><div class="rc-sub">en la semana</div></div>
      <div class="rc ${totalDef>0?'alerta':'ok'}"><div class="rc-icon">${totalDef>0?'👥':'✓'}</div><div class="rc-lbl">Déficit</div><div class="rc-val">${totalDef}</div><div class="rc-sub">médicos faltantes</div></div>
      <div class="rc ${tc[tm[0]]>0?'alerta':''}"><div class="rc-icon">🕐</div><div class="rc-lbl">Turno crítico</div><div class="rc-val" style="font-size:1.1rem">${nTurnoC(tm[0])}</div><div class="rc-sub">${tm[1]} día${tm[1]!==1?'s':''} con déficit</div></div>
    </div>
    ${conProb>0?`<div class="alertas-box"><div class="alertas-title">⚠️ Días que requieren atención (${conProb})</div>${dias.filter(d=>d.hayProb).map(d=>{const def=d.probs.reduce((s,p)=>s+p.def,0);const ts=d.probs.map(p=>nTurnoC(p.t)).join(', ');return`<div class="alerta-row"><div><strong>${d.nombre} ${d.d.getDate()} ${MESES[d.d.getMonth()]}</strong> &nbsp;<span style="color:var(--gray);font-size:.68rem">${ts}</span></div><div class="alerta-badge">−${def} médico${def!==1?'s':''}</div></div>`;}). join('')}</div>`:''}
  </div>`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  dias.forEach((dia,idx)=>{
    const card=document.createElement('div');
    card.className='day-card'+(dia.hayProb?' prob':'');
    card.style.animationDelay=idx*.04+'s';
    const tv=dia.cnt.M+dia.cnt.D+dia.cnt.T;
    const ct=dia.dp.M+dia.dp.D+dia.dp.T;
    card.innerHTML=`
      <div class="day-hdr">
        <div><div class="day-name">${dia.nombre}</div><div class="day-date">${dia.d.getDate()} ${MESES[dia.d.getMonth()]}</div><div class="day-meta">${tv} visita${tv!==1?'s':''} · cap. ${ct}</div></div>
        <div class="sicon ${dia.hayProb?'alerta':'ok'}">${dia.hayProb?'⚠️':'✓'}</div>
      </div>
      ${['M','D','T'].map(t=>{const v=dia.cnt[t],dp=dia.dp[t],def=v-dp,prob=def>0;return`<div class="turno ${prob?'prob':''}"><div class="turno-hdr"><span class="turno-lbl">${nTurno(t)}</span>${prob?`<span class="dbadge">−${def}</span>`:''}</div><div class="turno-stats"><div class="tg"><div class="tl">Visitas</div><div class="tv ${prob?'bad':''}">${v}</div></div><div class="tsep">/</div><div class="tg"><div class="tl">Disponibles</div><div class="tv ${prob?'bad':'ok'}">${dp}</div></div></div>${dia.med[t]?`<div class="medicos" title="${dia.med[t]}">${dia.med[t]}</div>`:''}</div>`;}). join('')}
      ${dia.visitas.length>0?`<div class="vlist"><div class="vlbl">Visitas (${dia.visitas.length})</div>${dia.visitas.map(v=>`<div class="vi"><div class="vi-name">${v.s}</div><div class="vi-time">${fmtH(v.ini)} – ${fmtH(v.fin)}</div></div>`).join('')}</div>`:''}
    `;
    grid.appendChild(card);
  });
}
window.addEventListener('DOMContentLoaded',render);
</script>
</body>
